<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='serif' fill='%23D4AF37'>▲</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARCVAULT — Curated Digital Art & On-Chain Ownership</title>
    <meta name="description" content="ARCVAULT is a curated platform for museum-grade digital artworks and on-chain ownership. Mint, authenticate, collect, and trade exceptional digital culture." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                DEFAULT: '#D4AF37',
                light: '#FFF6D6',
                dark: '#AA820A'
              }
            },
            fontFamily: {
              editorial: ['Cinzel', 'serif'],
              display: ['Syne', 'sans-serif'],
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            }
          }
        }
      }
    </script>

  <body class="bg-[#08080A] text-[#F5F5F7] antialiased selection:bg-[#D4AF37] selection:text-black">
